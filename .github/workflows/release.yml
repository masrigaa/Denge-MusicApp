name: Auto Release APK

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Tag name for release (e.g. v1.5.7)'
                required: false
                default: ''

permissions:
    contents: write

jobs:
    build-and-release:
        name: Build APK and Create Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Setup Gradle with caching
              uses: gradle/actions/setup-gradle@v4

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Build debug APK
              run: ./gradlew assembleDebug

            - name: Prepare APK Asset
              id: prepare_asset
              run: |
                  TAG_NAME="${{ github.ref_name }}"
                  if [ -n "${{ github.event.inputs.tag_name }}" ]; then
                      TAG_NAME="${{ github.event.inputs.tag_name }}"
                  fi
                  cp app/build/outputs/apk/debug/app-debug.apk "Denge-${TAG_NAME}.apk"
                  cp app/build/outputs/apk/debug/app-debug.apk "Denge.apk"
                  echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.prepare_asset.outputs.tag_name }}
                  name: "Denge ${{ steps.prepare_asset.outputs.tag_name }}"
                  generate_release_notes: true
                  draft: false
                  prerelease: false
                  files: |
                      Denge-${{ steps.prepare_asset.outputs.tag_name }}.apk
                      Denge.apk
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
